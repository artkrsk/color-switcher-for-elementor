<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Arts Color Switcher for Elementor">
  <title>Arts Color Switcher for Elementor</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="256" x2="256" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#333333"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <clipPath id="win"><rect x="26" y="42" width="204" height="172" rx="26"/></clipPath>
    <style>
      /* One 5.6s loop: the knob slides and every color on the page cross-fades in
         lockstep, the way the plugin's scalar morphs a page. Attribute fills below
         carry the LIGHT state on purpose: it is what reduced-motion and any static
         raster of this file (the PNG fallbacks) must render.

         Nothing in this stylesheet may contain a literal angle bracket or ampersand.
         Served as an image the file is parsed as XML, where style contents are NOT
         raw text, so a bare bracket opens a phantom element and the whole SVG fails
         to parse - silently, as a broken image. */
      .page { animation: page 5.6s infinite; }
      .ink { animation: ink 5.6s infinite; }
      .acc { animation: acc 5.6s infinite; }
      .trk { animation: trk 5.6s infinite; }
      .knob { animation: knob 5.6s infinite; will-change: transform; }
      @keyframes page {
        0%, 32% { fill: #EDEDF2; animation-timing-function: cubic-bezier(.4,0,.2,1); }
        40%, 76% { fill: #17171C; animation-timing-function: cubic-bezier(.4,0,.2,1); }
        84%, 100% { fill: #EDEDF2; }
      }
      @keyframes ink {
        0%, 32% { fill: #23232B; animation-timing-function: cubic-bezier(.4,0,.2,1); }
        40%, 76% { fill: #FFFFFF; animation-timing-function: cubic-bezier(.4,0,.2,1); }
        84%, 100% { fill: #23232B; }
      }
      @keyframes acc {
        0%, 32% { fill: #4F46E5; animation-timing-function: cubic-bezier(.4,0,.2,1); }
        40%, 76% { fill: #0D9488; animation-timing-function: cubic-bezier(.4,0,.2,1); }
        84%, 100% { fill: #4F46E5; }
      }
      @keyframes trk {
        0%, 32% { fill: #23232B; animation-timing-function: cubic-bezier(.4,0,.2,1); }
        40%, 76% { fill: #4F46E5; animation-timing-function: cubic-bezier(.4,0,.2,1); }
        84%, 100% { fill: #23232B; }
      }
      @keyframes knob {
        0%, 32% { transform: translateX(0); fill: #EDEDF2; animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
        40%, 76% { transform: translateX(22px); fill: #FFFFFF; animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
        84%, 100% { transform: translateX(0); fill: #EDEDF2; }
      }
      @media (prefers-reduced-motion: reduce) {
        .page, .ink, .acc, .trk, .knob { animation: none; }
      }
    </style>
  </defs>

  <rect width="256" height="256" rx="54" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="254.5" height="254.5" rx="53.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <g clip-path="url(#win)">
    <rect class="page" x="26" y="42" width="204" height="172" fill="#EDEDF2"/>
    <rect class="ink" x="46" y="66" width="88" height="14" rx="7" fill="#23232B"/>
    <rect class="trk" x="158" y="62" width="44" height="22" rx="11" fill="#23232B"/>
    <circle class="knob" cx="169" cy="73" r="8" fill="#EDEDF2"/>
    <rect class="acc" x="46" y="100" width="164" height="56" rx="12" fill="#4F46E5"/>
    <rect class="ink" x="46" y="172" width="112" height="9" rx="4" fill="#23232B"/>
    <rect class="ink" x="46" y="190" width="86" height="9" rx="4" fill="#23232B"/>
  </g>

  <rect x="26" y="42" width="204" height="172" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.12"/>
</svg>
