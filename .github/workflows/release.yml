name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/release.yml@main
    with:
      node_version: '24'
      # Strauss (require-dev) pulls symfony/* and league/flysystem, which need
      # PHP 8.1+ — the shared workflow's 8.0 default cannot satisfy the lock.
      # Build toolchain only; the plugin's own floor stays 8.0 (see canary.yml).
      php_version: '8.4'
      build_command: 'composer install --prefer-dist --no-progress && pnpm build'
      # Auto-detection would match any dev fixture carrying a Plugin Name
      # header — pin both explicitly.
      plugin_slug: 'color-switcher-for-elementor'
      main_plugin_file: 'src/wordpress-plugin/color-switcher-for-elementor.php'
      assets_directory: '.wordpress-org'
      use_arts_changelog: true
      deploy_to_wordpress: true
    secrets:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
